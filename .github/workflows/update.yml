
name: Car Price Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: car-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          pip install requests beautifulsoup4 playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Verify Playwright
        run: |
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print('Playwright Chromium OK'); b.close(); p.stop()"

      - name: Get car prices
        run: python update_cars.py

      - name: Save car database
        run: |
          python -m json.tool cars_preview.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cars_preview.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update car price database"
            git push origin main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp cars_preview.json _site/cars.json
          cp cars_preview.json _site/cars_preview.json

      - name: Verify website database
        run: |
          python -c "import json; d=json.load(open('_site/cars.json')); print('公開データ件数:',len(d['cars']))"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
