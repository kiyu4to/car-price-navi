
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable"
 content="yes">
<meta name="theme-color" content="#075985">
<title>新車価格ナビ</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: sans-serif;
  background: #f0f4f8;
  margin: 0;
  color: #203040;
}

header {
  background: #075985;
  color: white;
  padding: 24px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin-bottom: 0;
  letter-spacing: 2px;
}

main {
  max-width: 600px;
  margin: 12px auto;
  padding: 16px;
}

.panel {
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 4px 15px #00000010;
}

label {
  display: block;
  font-weight: bold;
  margin: 16px 0 8px;
}

select {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: white;
  color: #203040;
}

.result {
  margin-top: 25px;
  padding: 24px 10px;
  background: #e0f2fe;
  border-radius: 12px;
  text-align: center;
}

#price {
  font-size: 32px;
  font-weight: bold;
  color: #075985;
  margin: 12px 0;
}

#detail {
  font-size: 14px;
  line-height: 1.8;
}

#status {
  font-size: 12px;
  margin-top: 12px;
  color: #92400e;
  font-weight: bold;
}

#updated {
  font-size: 12px;
  color: #64748b;
  margin-top: 15px;
}

#connection {
  font-size: 12px;
  padding: 10px;
  background: #f1f5f9;
  border-radius: 8px;
  text-align: center;
}

a {
  color: #075985;
}

.official {
  display: block;
  padding: 14px;
  border: 1px solid #075985;
  border-radius: 8px;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 12px;
  background: #075985;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  margin-top: 12px;
}

button:disabled {
  opacity: 0.5;
}

.note {
  font-size: 12px;
  color: #64748b;
  line-height: 1.8;
}
</style>
</head>

<body>

<header>
  <h1>新車価格ナビ</h1>
  <p>CAR PRICE NAVI</p>
</header>

<main>
<div class="panel">

  <div id="connection">
    データベース接続中...
  </div>

  <label for="maker">メーカー</label>
  <select id="maker"></select>

  <label for="car">車種</label>
  <select id="car"></select>

  <label for="grade">グレード</label>
  <select id="grade"></select>

  <label for="drive">駆動方式</label>
  <select id="drive"></select>

  <label for="transmission">変速機</label>
  <select id="transmission"></select>

  <div class="result">
    <div id="priceLabel">
      車両本体価格（税込）
    </div>
    <div id="price">---</div>
    <div id="detail"></div>
    <div id="status"></div>
  </div>

  <p id="updated"></p>

  <p>
    <a id="official"
       class="official"
       target="_blank"
       rel="noopener noreferrer">
      メーカー公式HPを確認する
    </a>
  </p>

  <button id="reload">
    最新データを読み込む
  </button>

  <p class="note">
    ※公式HP取得価格は確認用の最低掲載価格です。
    標準車両本体価格と一致しない場合があります。
    複数の変速機が併記される場合は共通掲載価格候補です。
    仮データは実際の販売価格ではありません。
    オプション・諸費用等は含まれません。
    正式な価格はメーカー公式HPでご確認ください。
  </p>

</div>
</main>

<script>

const urls = {
  "トヨタ": "https://toyota.jp/",
  "ホンダ": "https://www.honda.co.jp/auto/",
  "スズキ": "https://www.suzuki.co.jp/car/",
  "ダイハツ": "https://www.daihatsu.co.jp/"
};

const sample = {
  "トヨタ": {
    "ヤリス": {
      "X": 1600000,
      "G": 1850000,
      "Z": 2100000
    },
    "アクア": {
      "X": 2200000,
      "G": 2400000,
      "Z": 2650000
    }
  },
  "ホンダ": {
    "N-BOX": {
      "ベースグレード": 1700000,
      "CUSTOM": 1900000,
      "CUSTOM ターボ": 2100000
    }
  },
  "スズキ": {
    "ハスラー": {
      "HYBRID G": 1500000,
      "HYBRID X": 1700000
    },
    "スペーシア": {
      "HYBRID G": 1550000,
      "HYBRID X": 1750000
    }
  },
  "ダイハツ": {
    "タント": {
      "L": 1450000,
      "X": 1600000,
      "カスタムRS": 2000000
    }
  }
};

const maker = document.getElementById("maker");
const car = document.getElementById("car");
const grade = document.getElementById("grade");
const drive = document.getElementById("drive");
const transmission =
  document.getElementById("transmission");
const reload = document.getElementById("reload");

let cars = [];

// 仮データの変換

function sampleCars() {

  const result = [];

  for (const [m, models] of Object.entries(sample)) {

    for (const [c, grades] of Object.entries(models)) {

      for (const [g, p] of Object.entries(grades)) {

        result.push({
          maker: m,
          model: c,
          grade: g,
          drive: "未設定",
          transmission: "未設定",
          price: p,
          source_url: urls[m],
          status: "sample"
        });

      }
    }
  }

  return result;
}

// 選択肢の作成

function fill(select, items) {

  select.replaceChildren();

  [...new Set(items)].forEach(item => {
    select.add(new Option(item, item));
  });
}

// 車種選択

function updateCars() {

  const list = cars.filter(
    c => c.maker === maker.value
  );

  fill(car, list.map(c => c.model));

  updateGrades();
}

// グレード選択

function updateGrades() {

  const list = cars.filter(
    c => c.maker === maker.value
      && c.model === car.value
  );

  fill(grade, list.map(c => c.grade));

  updateDrives();
}

// 駆動方式選択

function updateDrives() {

  const list = cars.filter(
    c => c.maker === maker.value
      && c.model === car.value
      && c.grade === grade.value
  );

  fill(drive, list.map(c => c.drive));

  updateTransmissions();
}

// 変速機選択

function updateTransmissions() {

  const list = cars.filter(
    c => c.maker === maker.value
      && c.model === car.value
      && c.grade === grade.value
      && c.drive === drive.value
  );

  fill(
    transmission,
    list.map(
      c => c.transmission || "未設定"
    )
  );

  updatePrice();
}

// 価格表示

function updatePrice() {

  const selected = cars.find(
    c => c.maker === maker.value
      && c.model === car.value
      && c.grade === grade.value
      && c.drive === drive.value
      && (c.transmission || "未設定")
        === transmission.value
  );

  const price = document.getElementById("price");
  const detail = document.getElementById("detail");
  const status = document.getElementById("status");
  const updated = document.getElementById("updated");
  const official = document.getElementById("official");
  const label = document.getElementById("priceLabel");

  if (!selected) {

    label.textContent = "車両本体価格";
    price.textContent = "価格未登録";
    detail.textContent = "";
    status.textContent = "";
    updated.textContent = "";

    official.removeAttribute("href");

    return;
  }

  price.textContent =
    selected.price.toLocaleString("ja-JP") + " 円";

  detail.textContent = [
    selected.maker,
    selected.model,
    selected.grade,
    selected.drive,
    selected.transmission || ""
  ].filter(Boolean).join(" ");

  if (selected.status === "sample") {

    label.textContent =
      "車両本体価格（仮価格）";

    status.textContent =
      "仮データ・参考表示";

  } else {

    label.textContent =
      "最低掲載価格候補（税込）";

    status.textContent =
      "メーカー公式HP取得・価格確認待ち";

    if (
      selected.transmission &&
      selected.transmission.includes("/")
    ) {

      status.textContent +=
        "・変速機別価格未確認";

    }
  }

  if (selected.updated_at) {

    const date = new Date(selected.updated_at);

    updated.textContent =
      "情報取得日時：" +
      date.toLocaleString("ja-JP", {
        timeZone: "Asia/Tokyo"
      });

  } else {

    updated.textContent =
      "情報取得日時：未登録";

  }

  const source =
    selected.source_url || urls[selected.maker];

  if (source && /^https:\/\//i.test(source)) {

    official.href = source;

  } else {

    official.removeAttribute("href");

  }
}

// データベース読み込み

async function loadData() {

  const connection =
    document.getElementById("connection");

  connection.textContent =
    "データベース接続中...";

  connection.style.color = "#64748b";

  reload.disabled = true;

  cars = sampleCars();

  try {

    const response = await fetch(
      "./cars_preview.json?v=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data = await response.json();

    if (!Array.isArray(data.cars)) {

      throw new Error(
        "データ形式が不正です"
      );

    }

    const validCars = data.cars.filter(
      c => c
        && typeof c.maker === "string"
        && typeof c.model === "string"
        && typeof c.grade === "string"
        && typeof c.drive === "string"
        && c.maker.trim() !== ""
        && c.model.trim() !== ""
        && c.grade.trim() !== ""
        && c.drive.trim() !== ""
        && c.status === "review_required"
        && c.price_type === "minimum_listed"
        && c.tax_included === true
        && Number.isFinite(c.price)
        && c.price > 0
    );

    // 変速機を含めた重複判定

    const unique = new Map();

    for (const c of validCars) {

      const record = {
        ...c,
        transmission:
          typeof c.transmission === "string"
          && c.transmission.trim()
            ? c.transmission.trim()
            : "未設定"
      };

      const key = JSON.stringify([
        record.maker,
        record.model,
        record.grade,
        record.drive,
        record.transmission
      ]);

      unique.set(key, record);

    }

    const officialCars = [...unique.values()];

    if (officialCars.length === 0) {

      throw new Error(
        "有効な車両データがありません"
      );

    }

    // 取得済み車種の仮データを削除

    const officialModels = new Set(
      officialCars.map(
        c => JSON.stringify([
          c.maker,
          c.model
        ])
      )
    );

    cars = cars.filter(
      c => !officialModels.has(
        JSON.stringify([
          c.maker,
          c.model
        ])
      )
    );

    cars.push(...officialCars);

    connection.textContent =
      "データベース接続成功：" +
      officialCars.length + "件";

    connection.style.color = "#15803d";

  } catch (error) {

    connection.textContent =
      "データ取得失敗：仮データを表示中";

    connection.style.color = "#b91c1c";

    console.error(error);

  } finally {

    reload.disabled = false;

  }

  fill(maker, cars.map(c => c.maker));

  if (cars.some(c => c.maker === "スズキ")) {

    maker.value = "スズキ";

  }

  updateCars();

  if (cars.some(
    c => c.maker === maker.value
      && c.model === "ハスラー"
  )) {

    car.value = "ハスラー";

    updateGrades();

  }
}

maker.onchange = updateCars;
car.onchange = updateGrades;
grade.onchange = updateDrives;
drive.onchange = updateTransmissions;
transmission.onchange = updatePrice;

reload.onclick = loadData;

loadData();

</script>
</body>
</html>
